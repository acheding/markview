        <meta
            property="og:description"
            content="左侧编辑、右侧实时预览的在线 Markdown 编辑器。支持 Mermaid 图表、KaTeX 公式与 PDF 导出，文档只存在你的浏览器里，无需注册、可离线使用。"

            name="twitter:description"
            content="左侧编辑、右侧实时预览的在线 Markdown 编辑器。支持 Mermaid 图表、KaTeX 公式与 PDF 导出，文档只存在你的浏览器里，无需注册、可离线使用。"
        />
        <meta name="twitter:image" content="https://markview.art/og-image.png" />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "SoftwareApplication",
                "name": "MarkView",
                "url": "https://markview.art/",
                "applicationCategory": "WebApplication",
                "operatingSystem": "任何支持现代浏览器的系统",
                "inLanguage": "zh-CN",
                "description": "完全在浏览器中运行的在线 Markdown 编辑器，左侧编辑右侧实时预览，支持 Mermaid 图表、KaTeX 公式与 PDF 导出，文档保存在本地，无需注册。",
                "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" },
                "featureList": [
                    "Markdown 实时预览",
                    "Mermaid 图表渲染",
                    "KaTeX 数学公式",
                    "导出 Markdown / HTML / PDF",
                    "本地文件读写",
                    "离线可用的 PWA"
                ]
            }
        </script>
        <script>
            // 挂载前先定好主题，避免暗色用户看到浅色闪屏（与 useTheme.js 的 key 一致）。
            ;(function () {
                try {
                    var t = localStorage.getItem('markview:theme')
                    if (t !== 'dark' && t !== 'light') {
                        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
                    }
                    document.documentElement.dataset.theme = t
                    // PWA 标题栏颜色同步跟主题（色值与 useTheme.js 的 THEME_COLORS 保持一致）
                    var meta = document.querySelector('meta[name="theme-color"]')
                    if (meta) meta.content = t === 'dark' ? '#1e1e21' : '#dbe3f7'
                } catch (e) {
                    /* 忽略 */
                }
                document.title = 'MarkView'
            })()
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
