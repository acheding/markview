<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#dbe3f7" />
        <title>MarkView</title>
        <script>
            // 挂载前先定好主题，避免暗色用户看到浅色闪屏（与 useTheme.js 的 key 一致）。
            ;(function () {
                try {
                    var t = localStorage.getItem('markview:theme')
                    if (t !== 'dark' && t !== 'light') {
                        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
                    }
                    document.documentElement.dataset.theme = t
                    // PWA 标题栏颜色同步跟主题（色值与 useTheme.js 的 THEME_COLORS 保持一致）
                    var meta = document.querySelector('meta[name="theme-color"]')
                    if (meta) meta.content = t === 'dark' ? '#1e1e21' : '#dbe3f7'
                } catch (e) {
                    /* 忽略 */
                }
                document.title = 'MarkView'
            })()
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
