<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MarkView">
    <defs>
        <linearGradient id="mvBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6b83e0" />
            <stop offset="1" stop-color="#3451b2" />
        </linearGradient>
        <linearGradient id="mvArrow" gradientUnits="userSpaceOnUse" x1="366" y1="144" x2="366" y2="288">
            <stop offset="0" stop-color="#8bf3de" />
            <stop offset="1" stop-color="#2fd0bc" />
        </linearGradient>
    </defs>
    <!-- 底：主题靛蓝对角渐变 + 玻璃内高光 -->
    <rect width="512" height="512" rx="112" fill="url(#mvBg)" />
    <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" />
    <!-- 统一圆角描边语言：M（白）+ 箭头（薄荷青）为 Markdown 源；下方两行为渲染预览 -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M120 288 L120 140 L190 206 L260 140 L260 288" stroke="#ffffff" stroke-width="44" />
        <path d="M366 144 L366 256" stroke="url(#mvArrow)" stroke-width="44" />
        <path d="M330 226 L366 288 L402 226" stroke="url(#mvArrow)" stroke-width="44" />
        <path d="M120 346 L372 346" stroke="#ffffff" stroke-width="36" stroke-opacity="0.92" />
        <path d="M120 400 L300 400" stroke="#ffffff" stroke-width="36" stroke-opacity="0.62" />
    </g>
</svg>
